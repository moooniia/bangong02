# bangong02 on Tencent 109 — HTTP self-test (DNS not switched yet)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bangong02.com www.bangong02.com 43.142.98.170 _;

    root /home/ubuntu/bangong02/frontend;
    index index.html;

    client_max_body_size 100m;

    location = / {
        if ($http_referer ~ "/login") {
            return 302 /dashboard;
        }
        try_files /index.html =404;
    }

    # Flask API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Umami / stats (optional; 502 until umami docker is up)
    location = /script.js {
        proxy_pass http://127.0.0.1:3000/script.js;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /_next/ {
        proxy_pass http://127.0.0.1:3000/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/i {
        proxy_pass http://127.0.0.1:3000/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
