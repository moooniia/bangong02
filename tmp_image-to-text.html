<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片转文字 — 办公工具箱</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="/assets/common.css">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root { --pink:#e94c88; --pink-bg:#fdf0f6; --near-white:#fbfbfb; --light-gray:#f4f4f4; --dark:#252525; --mid:#333; --ink3:#888; --ink4:#ccc; --border:#ebebeb; --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06); }
body { font-family:'Noto Sans SC',sans-serif; background:var(--near-white); color:var(--dark); font-size:14px; }
nav { position:sticky; top:0; z-index:99; height:68px; padding:0 56px; display:flex; align-items:center; justify-content:space-between; background:rgba(251,251,251,.95); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
.logo { font-family:'Playfair Display',serif; font-size:20px; font-weight:900; color:var(--dark); text-decoration:none; }
.logo span { color:var(--pink); }
.nav-links { display:flex; gap:2px; list-style:none; }
.nav-links a { text-decoration:none; color:var(--ink3); font-size:13px; font-weight:500; padding:6px 14px; border-radius:20px; }
.nav-links a:hover { color:var(--dark); background:var(--light-gray); }
main { max-width:780px; margin:0 auto; padding:56px 32px 100px; }
.breadcrumb { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink4); margin-bottom:32px; }
.breadcrumb a { text-decoration:none; color:var(--ink4); }
.breadcrumb a:hover { color:var(--pink); }
.tool-header { margin-bottom:40px; }
.tool-title-row { display:flex; align-items:center; gap:16px; margin-bottom:10px; }
.tool-icon-big { width:52px; height:52px; background:var(--pink-bg); border-radius:14px; display:flex; align-items:center; justify-content:center; }
.tool-icon-big i { font-size:28px; color:var(--pink); }
.tool-header h1 { font-family:'Playfair Display',serif; font-size:32px; font-weight:900; }
.tool-desc { font-size:14px; color:var(--ink3); line-height:1.75; margin-left:68px; }
.upload-area { border:2px dashed var(--border); border-radius:16px; padding:56px 32px; text-align:center; cursor:pointer; background:white; margin-bottom:24px; transition:.2s; }
.upload-area:hover { border-color:var(--pink); background:var(--pink-bg); }
.upload-icon { font-size:48px; color:var(--ink4); margin-bottom:16px; display:block; }
.upload-title { font-size:16px; font-weight:700; margin-bottom:6px; }
.upload-sub { font-size:13px; color:var(--ink3); margin-bottom:20px; }
.upload-btn { display:inline-flex; align-items:center; gap:8px; background:var(--pink); color:white; font-size:13px; font-weight:700; padding:10px 24px; border-radius:24px; border:none; cursor:pointer; font-family:inherit; }
.convert-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:10px; background:var(--pink); color:white; font-size:15px; font-weight:700; padding:16px; border-radius:var(--radius); border:none; cursor:pointer; font-family:inherit; margin-bottom:12px; }
.convert-btn:disabled { background:var(--ink4); cursor:not-allowed; }
.result-text { display:none; background:white; border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-top:24px; box-shadow:var(--shadow); }
.result-text h3 { font-size:14px; margin-bottom:12px; }
.result-text pre { white-space:pre-wrap; word-break:break-word; font-family:inherit; font-size:13px; line-height:1.8; color:var(--mid); background:var(--light-gray); padding:16px; border-radius:8px; max-height:400px; overflow:auto; }
.copy-btn { margin-top:12px; display:inline-flex; align-items:center; gap:6px; background:var(--dark); color:white; border:none; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:12px; font-family:inherit; }
.error-area { display:none; background:#fff5f5; border:1px solid #fca5a5; border-radius:var(--radius); padding:20px; margin-top:24px; text-align:center; color:#dc2626; font-size:13px; }
.progress-area { display:none; text-align:center; padding:32px; background:white; border:1px solid var(--border); border-radius:var(--radius); margin-top:24px; }
.progress-label { font-size:14px; font-weight:600; color:var(--dark); margin-bottom:16px; }
.progress-bar-wrap { background:var(--light-gray); border-radius:8px; height:8px; overflow:hidden; margin-bottom:10px; }
.progress-bar { height:100%; border-radius:8px; background:linear-gradient(90deg,var(--pink),#f5a8cc); width:0%; transition:width 0.3s ease; }
.progress-pct { font-size:12px; color:var(--ink3); }
</style>
  <script src="/assets/analytics.js" defer>
function resetAll() {
  if (typeof removeFile === 'function') removeFile();
  var r = document.getElementById('resultArea');
  if (r) r.style.display = 'none';
  var e = document.getElementById('errorArea');
  if (e) e.style.display = 'none';
  var btn = document.getElementById('convertBtn');
  if (btn) { btn.style.display = ''; btn.disabled = false; }
  var hint = document.querySelector('.convert-hint');
  if (hint) hint.style.display = '';
  var opts = document.querySelector('.options');
  if (opts) opts.style.display = '';
}
</script>
</head>
<body>
<nav>
  <a class="logo" href="/">办公<span>工具箱</span></a>
  <ul class="nav-links">
    <li><a href="/#pdf">PDF处理</a></li>
    <li><a href="/#ocr">文字识别</a></li>
    <li><a href="/#image">图片处理</a></li>
    <li><a href="/#translate">翻译</a></li>
  </ul>
</nav>
<main>
  <div class="breadcrumb"><a href="/">首页</a><i class="ti ti-chevron-right"></i><a href="/#ocr">文字识别</a><i class="ti ti-chevron-right"></i><span>图片转文字</span></div>
  <div class="tool-header">
    <div class="tool-title-row">
      <div class="tool-icon-big"><i class="ti ti-photo-scan"></i></div>
      <h1>图片转文字</h1>
    </div>
    <p class="tool-desc">上传 JPG、PNG 图片，自动识别其中的文字内容。手机长截图、聊天图片均可，请尽量选清晰、文字放大的原图。</p>
  </div>
  <div class="upload-area" id="uploadArea">
    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png" style="display:none" onchange="handleFile(this)">
    <i class="ti ti-cloud-upload upload-icon"></i>
    <div class="upload-title">拖拽图片到这里</div>
    <div class="upload-sub">支持 JPG、PNG 格式</div>
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()"><i class="ti ti-photo"></i>选择图片</button>
  </div>
  <button class="convert-btn" id="convertBtn" onclick="startOcr()" disabled><i class="ti ti-scan"></i>开始识别</button>
  <div class="progress-area" id="progressArea">
    <div class="progress-label" id="progressLabel">正在识别，请稍候…</div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-pct" id="progressPct">0%</div>
  </div>
  <div class="error-area" id="errorArea"></div>
  <div class="result-text" id="resultArea">
    <h3>识别结果</h3>
    <pre id="resultText"></pre>
    <button class="copy-btn" onclick="copyText()"><i class="ti ti-copy"></i>复制文字</button>
    <a href="#" class="copy-btn" id="downloadLink" style="margin-left:8px;text-decoration:none"><i class="ti ti-download"></i>下载 TXT</a>
  </div>
</main>
<script src="/assets/convert-progress.js"></script>
<script>
let selectedFile = null;
function handleFile(input) {
  selectedFile = input.files[0];
  if (selectedFile) document.getElementById('convertBtn').disabled = false;
}
async function startOcr() {
  if (!selectedFile) return;
  const fd = new FormData();
  fd.append('file', selectedFile);
  fd.append('lang', 'auto');
  fd.append('output', 'file');
  document.getElementById('progressArea').style.display = 'block';
  document.getElementById('errorArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'none';
  const barCtrl = ConvertProgress.showProgress(
    document.getElementById('progressLabel'),
    document.getElementById('progressBar'),
    document.getElementById('progressPct'),
    'ocr',
    selectedFile
  );
  try {
    const res = await fetch('/api/ocr', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.success) {
      barCtrl.complete();
      setTimeout(() => {
        document.getElementById('progressArea').style.display = 'none';
        document.getElementById('resultText').textContent = data.text;
        document.getElementById('downloadLink').href = '/api/download/' + data.filename;
        document.getElementById('resultArea').style.display = 'block';
      }, 500);
    } else throw new Error(data.error);
  } catch (e) {
    barCtrl.stop();
    document.getElementById('progressArea').style.display = 'none';
    document.getElementById('errorArea').textContent = e.message || '识别失败';
    document.getElementById('errorArea').style.display = 'block';
  }
}
function copyText() {
  navigator.clipboard.writeText(document.getElementById('resultText').textContent);
  alert('已复制到剪贴板');
}
const ua = document.getElementById('uploadArea');
ua.addEventListener('dragover', e => e.preventDefault());
ua.addEventListener('drop', e => { e.preventDefault(); selectedFile = e.dataTransfer.files[0]; if(selectedFile) document.getElementById('convertBtn').disabled = false; });
</script>
</body>
</html>
