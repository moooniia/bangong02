<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>意见反馈 — 办公工具箱</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="/assets/common.css">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<script>(function(){try{var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#e94c88;--pink-bg:#fdf0f6;--near-white:#fbfbfb;--light-gray:#f4f4f4;--dark:#252525;--mid:#333;--ink3:#888;--ink4:#ccc;--border:#ebebeb;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06)}
body{font-family:'Noto Sans SC',sans-serif;background:var(--near-white);color:var(--dark);font-size:14px}
nav{position:sticky;top:0;z-index:99;height:68px;padding:0 56px;display:flex;align-items:center;justify-content:space-between;background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--dark);text-decoration:none}.logo span{color:var(--pink)}
.nav-links{display:flex;gap:2px;list-style:none}
.nav-links a{text-decoration:none;color:var(--ink3);font-size:13px;font-weight:500;padding:6px 14px;border-radius:20px;transition:all .15s}
.nav-links a:hover{color:var(--dark);background:var(--light-gray)}
main{max-width:680px;margin:0 auto;padding:56px 32px 100px}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink4);margin-bottom:32px}
.breadcrumb a{text-decoration:none;color:var(--ink4);transition:color .15s}
.breadcrumb a:hover{color:var(--pink)}
.tool-header{margin-bottom:40px}
.tool-title-row{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.tool-icon-big{width:52px;height:52px;background:var(--pink-bg);border-radius:14px;display:flex;align-items:center;justify-content:center}
.tool-icon-big i{font-size:28px;color:var(--pink)}
.tool-header h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900}
.tool-desc{font-size:14px;color:var(--ink3);line-height:1.75;margin-left:68px}
.form-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);margin-bottom:24px}
.form-row{margin-bottom:20px}
.form-row:last-child{margin-bottom:0}
.form-label{font-size:13px;font-weight:700;margin-bottom:8px;display:block}
.form-label .opt{font-weight:500;color:var(--ink4);font-size:12px}
textarea, input[type=text]{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:14px;outline:none;transition:border-color .15s}
textarea{min-height:160px;resize:vertical;line-height:1.7}
textarea:focus, input[type=text]:focus{border-color:var(--pink)}
.char-count{font-size:11px;color:var(--ink4);text-align:right;margin-top:6px}
.submit-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--pink);color:white;font-size:15px;font-weight:700;padding:16px;border-radius:var(--radius);border:none;cursor:pointer;font-family:inherit;transition:all .2s}
.submit-btn:hover{background:#d43d79;transform:translateY(-2px)}
.submit-btn:disabled{background:var(--ink4);cursor:not-allowed;transform:none}
.tip{font-size:12px;color:var(--ink4);text-align:center;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:5px}
.result-area, .error-area{display:none;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:32px 24px;text-align:center;box-shadow:var(--shadow)}
.result-area i{font-size:42px;color:#22c55e;margin-bottom:10px;display:block}
.error-area{background:var(--error-bg);border-color:var(--error-border);color:var(--error-text);font-size:13px}
.again-btn{margin-top:16px;display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:20px;padding:8px 18px;font-size:13px;color:var(--ink3);cursor:pointer;font-family:inherit;transition:all .15s}
.again-btn:hover{border-color:var(--pink);color:var(--pink)}
</style>
  <script src="/assets/analytics.js" defer></script>
<script src="/assets/theme-toggle.js" defer></script>
</head>
<body>
<nav>
  <a class="logo" href="/">办公<span>工具箱</span></a>
  <ul class="nav-links">
    <li><a href="/#pdf">PDF处理</a></li>
    <li><a href="/#ocr">文字识别</a></li>
    <li><a href="/#image">图片处理</a></li>
    <li><a href="/#translate">翻译</a></li>
    <li><a href="/#file">文件工具</a></li>
  </ul>
</nav>
<main>
  <div class="breadcrumb"><a href="/">首页</a><i class="ti ti-chevron-right"></i><span>意见反馈</span></div>
  <div class="tool-header">
    <div class="tool-title-row">
      <div class="tool-icon-big"><i class="ti ti-message-2"></i></div>
      <h1>意见反馈</h1>
    </div>
    <p class="tool-desc">工具不好用、识别效果差、想要新功能，都可以直接告诉我们。</p>
  </div>

  <div class="form-card" id="formCard">
    <div class="form-row">
      <label class="form-label">反馈内容</label>
      <textarea id="message" placeholder="比如：图片转文字识别效果不准确 / 希望增加XX工具 / PDF合并后顺序不对……" maxlength="2000" oninput="updateCount()"></textarea>
      <div class="char-count" id="charCount">0 / 2000</div>
    </div>
    <div class="form-row">
      <label class="form-label">联系方式 <span class="opt">（选填，方便我们回复你）</span></label>
      <input type="text" id="contact" placeholder="邮箱 / 微信 / 手机号，都行">
    </div>
    <div class="form-row">
      <button class="submit-btn" id="submitBtn" onclick="submitFeedback()" disabled><i class="ti ti-send"></i>提交反馈</button>
      <p class="tip"><i class="ti ti-shield-lock"></i>不会公开展示，只用于改进产品</p>
    </div>
  </div>

  <div class="result-area" id="resultArea">
    <i class="ti ti-circle-check"></i>
    <div style="font-weight:700;margin-bottom:4px">收到啦，谢谢你的反馈！</div>
    <div style="font-size:13px;color:var(--ink3)">我们会认真看每一条意见</div>
    <button class="again-btn" onclick="resetForm()"><i class="ti ti-refresh"></i>再提交一条</button>
  </div>
  <div class="error-area" id="errorArea"></div>
</main>
<script>
function updateCount() {
  var len = document.getElementById('message').value.length;
  document.getElementById('charCount').textContent = len + ' / 2000';
  document.getElementById('submitBtn').disabled = !document.getElementById('message').value.trim();
}

async function submitFeedback() {
  var message = document.getElementById('message').value.trim();
  var contact = document.getElementById('contact').value.trim();
  if (!message) return;
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i>提交中…';
  document.getElementById('errorArea').style.display = 'none';
  try {
    var res = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: message, contact: contact })
    });
    var data = await res.json();
    if (data.success) {
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';
    } else {
      throw new Error(data.error || '提交失败，请重试');
    }
  } catch (e) {
    document.getElementById('errorArea').textContent = e.message || '提交失败，请重试';
    document.getElementById('errorArea').style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-send"></i>提交反馈';
  }
}

function resetForm() {
  document.getElementById('message').value = '';
  document.getElementById('contact').value = '';
  updateCount();
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('formCard').style.display = 'block';
}
</script>
</body>
</html>
