<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抠章 — 办公工具箱</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="/assets/common.css">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<script>(function(){try{var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root { --pink:#e94c88; --pink-bg:#fdf0f6; --near-white:#fbfbfb; --light-gray:#f4f4f4; --dark:#252525; --ink3:#888; --ink4:#ccc; --border:#ebebeb; --radius:12px; }
body { font-family:'Noto Sans SC',sans-serif; background:var(--near-white); color:var(--dark); font-size:14px; }
nav { position:sticky; top:0; z-index:99; height:68px; padding:0 56px; display:flex; align-items:center; justify-content:space-between; background:var(--nav-bg); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
.logo { font-family:'Playfair Display',serif; font-size:20px; font-weight:900; color:var(--dark); text-decoration:none; }
.logo span { color:var(--pink); }
.nav-links { display:flex; gap:2px; list-style:none; }
.nav-links a { text-decoration:none; color:var(--ink3); font-size:13px; padding:6px 14px; border-radius:20px; }
main { max-width:780px; margin:0 auto; padding:56px 32px 100px; }
.breadcrumb { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink4); margin-bottom:32px; }
.breadcrumb a { text-decoration:none; color:var(--ink4); }
.tool-header h1 { font-family:'Playfair Display',serif; font-size:32px; font-weight:900; }
.tool-title-row { display:flex; align-items:center; gap:16px; margin-bottom:10px; }
.tool-icon-big { width:52px; height:52px; background:var(--pink-bg); border-radius:14px; display:flex; align-items:center; justify-content:center; }
.tool-icon-big i { font-size:28px; color:var(--pink); }
.tool-desc { font-size:14px; color:var(--ink3); line-height:1.75; margin-left:68px; margin-bottom:40px; }
.upload-area { border:2px dashed var(--border); border-radius:16px; padding:56px 32px; text-align:center; background:var(--card-bg); margin-bottom:24px; }
.upload-btn, .convert-btn { display:inline-flex; align-items:center; gap:8px; background:var(--pink); color:white; font-size:13px; font-weight:700; padding:10px 24px; border-radius:24px; border:none; cursor:pointer; font-family:inherit; }
.convert-btn { width:100%; justify-content:center; font-size:15px; padding:16px; border-radius:12px; margin-bottom:12px; }
.convert-btn:disabled { background:var(--ink4); }
.preview-area { display:none; text-align:center; margin-top:24px; background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:24px; }
.preview-area img { max-width:100%; max-height:300px; background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 50%/20px 20px; border-radius:8px; }
.download-btn { display:inline-flex; align-items:center; gap:8px; background:var(--dark); color:white; padding:12px 28px; border-radius:24px; text-decoration:none; margin-top:16px; font-weight:700; }
.error-area, .progress-area { display:none; margin-top:24px; text-align:center; padding:20px; border-radius:12px; }
.error-area { background:var(--error-bg); border:1px solid var(--error-border); color:var(--error-text); }
</style>
  <script src="/assets/analytics.js" defer></script>
<script src="/assets/theme-toggle.js" defer></script>
</head>
<body>
<nav>
  <a class="logo" href="/">办公<span>工具箱</span></a>
  <ul class="nav-links"><li><a href="/#image">图片处理</a></li></ul>
</nav>
<main>
  <div class="breadcrumb"><a href="/">首页</a><i class="ti ti-chevron-right"></i><a href="/#image">图片处理</a><i class="ti ti-chevron-right"></i><span>抠章</span></div>
  <div class="tool-header">
    <div class="tool-title-row">
      <div class="tool-icon-big"><i class="ti ti-rosette"></i></div>
      <h1>抠章</h1>
    </div>
    <p class="tool-desc">自动提取图片中的红色印章，生成透明背景 PNG，可直接插入文档使用。</p>
  </div>
  <div class="upload-area">
    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png" style="display:none" onchange="handleFile(this)">
    <i class="ti ti-cloud-upload" style="font-size:48px;color:var(--ink4);display:block;margin-bottom:16px"></i>
    <div style="font-weight:700;margin-bottom:6px">上传含红章的图片</div>
    <div style="font-size:13px;color:var(--ink3);margin-bottom:20px">支持 JPG、PNG，印章颜色越红效果越好</div>
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()"><i class="ti ti-photo"></i>选择图片</button>
  </div>
  <button class="convert-btn" id="convertBtn" onclick="startExtract()" disabled><i class="ti ti-cut"></i>开始抠章</button>
  <div class="progress-area" id="progressArea">正在提取红色印章...</div>
  <div class="error-area" id="errorArea"></div>
  <div class="preview-area" id="resultArea">
    <p style="margin-bottom:12px;font-weight:700">提取结果（透明背景）</p>
    <img id="previewImg" src="" alt="印章预览">
    <br>
    <a href="#" class="download-btn" id="downloadBtn"><i class="ti ti-download"></i>下载 PNG</a>
  </div>
</main>
<script>
let selectedFile = null;
let resultBlob = null;
function handleFile(input) { selectedFile = input.files[0]; if(selectedFile) document.getElementById('convertBtn').disabled = false; }
async function startExtract() {
  if (!selectedFile) return;
  const fd = new FormData();
  fd.append('file', selectedFile);
  document.getElementById('progressArea').style.display = 'block';
  document.getElementById('errorArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'none';
  try {
    const res = await fetch('/api/extract-seal', { method: 'POST', body: fd });
    const data = await res.json();
    document.getElementById('progressArea').style.display = 'none';
    if (data.success) {
      const url = '/api/download/' + data.filename;
      resultBlob = await (await fetch(url)).blob();
      const blobUrl = URL.createObjectURL(resultBlob);
      document.getElementById('previewImg').src = blobUrl;
      document.getElementById('downloadBtn').href = blobUrl;
      document.getElementById('downloadBtn').download = data.display_name || 'seal.png';
      document.getElementById('resultArea').style.display = 'block';
    } else throw new Error(data.error);
  } catch (e) {
    document.getElementById('errorArea').textContent = e.message || '抠章失败';
    document.getElementById('errorArea').style.display = 'block';
  }
}
</script>
</body>
</html>
