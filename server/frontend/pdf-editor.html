<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 编辑器 — 办公工具箱</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="/assets/common.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#e94c88;--pink-bg:#fdf0f6;--near-white:#fbfbfb;--light-gray:#f4f4f4;--dark:#252525;--ink3:#888;--ink4:#ccc;--border:#ebebeb;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06)}
body{font-family:'Noto Sans SC',sans-serif;background:var(--near-white);color:var(--dark);font-size:14px}
nav{position:sticky;top:0;z-index:99;height:68px;padding:0 56px;display:flex;align-items:center;justify-content:space-between;background:rgba(251,251,251,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--dark);text-decoration:none}.logo span{color:var(--pink)}
.nav-links{display:flex;gap:2px;list-style:none}.nav-links a{text-decoration:none;color:var(--ink3);font-size:13px;font-weight:500;padding:6px 14px;border-radius:20px}
.nav-links a:hover{color:var(--dark);background:var(--light-gray)}
main{max-width:920px;margin:0 auto;padding:56px 32px 100px}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink4);margin-bottom:32px}.breadcrumb a{text-decoration:none;color:var(--ink4)}
.tool-header{margin-bottom:40px}.tool-title-row{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.tool-icon-big{width:52px;height:52px;background:var(--pink-bg);border-radius:14px;display:flex;align-items:center;justify-content:center}
.tool-icon-big i{font-size:28px;color:var(--pink)}.tool-header h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900}
.tool-desc{font-size:14px;color:var(--ink3);line-height:1.75;margin-left:68px}

/* Upload */
.upload-area{border:2px dashed var(--border);border-radius:16px;padding:64px 32px;text-align:center;cursor:pointer;background:white;transition:.2s}
.upload-area:hover,.upload-area.drag{border-color:var(--pink);background:var(--pink-bg)}
.upload-icon{font-size:52px;color:var(--ink4);margin-bottom:14px;display:block}
.upload-title{font-size:17px;font-weight:700;margin-bottom:6px}
.upload-sub{font-size:13px;color:var(--ink3);margin-bottom:16px}
.pwd-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px}
.pwd-row label{font-size:12px;color:var(--ink3);white-space:nowrap}
.pwd-row input{border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;font-family:inherit;width:180px;outline:none}
.pwd-row input:focus{border-color:var(--pink)}
.loading-area{text-align:center;padding:64px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.page-count-badge{font-size:13px;font-weight:700;color:var(--ink3);flex:1}
.add-pdf-btn{display:inline-flex;align-items:center;gap:6px;background:white;border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:13px;font-weight:600;color:var(--dark);cursor:pointer;font-family:inherit;transition:.15s}
.add-pdf-btn:hover{border-color:var(--pink);color:var(--pink)}

/* Thumbnail grid */
.thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;background:white;border:1px solid var(--border);border-radius:16px;padding:16px;min-height:170px;margin-bottom:24px}
.thumb-grid-empty{display:flex;align-items:center;justify-content:center;color:var(--ink4);font-size:13px;grid-column:1/-1}
.thumb-card{position:relative;border:1px solid var(--border);border-radius:8px;overflow:visible;cursor:grab;background:white;transition:box-shadow .15s;user-select:none}
.thumb-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.thumb-card:active{cursor:grabbing}
.thumb-img{width:100%;height:auto;display:block;border-radius:7px 7px 0 0}
.thumb-label{font-size:11px;color:var(--ink3);text-align:center;padding:6px 4px}
.thumb-del{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:#ff4444;color:white;border:none;cursor:pointer;font-size:10px;display:none;align-items:center;justify-content:center;z-index:10;padding:0}
.thumb-card:hover .thumb-del{display:flex}
.thumb-ghost{opacity:.35;border:2px dashed var(--pink)!important}

/* Options panel */
.options-panel{background:white;border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px}
.opt-section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.opt-section:last-child{padding-bottom:0;margin-bottom:0;border-bottom:none}
.opt-title{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.opt-row{display:flex;align-items:center;gap:12px;padding:6px 0}
.opt-row>span{font-size:14px;font-weight:500;min-width:120px}
.text-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none;transition:.15s}
.text-input:focus{border-color:var(--pink)}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.srad{display:none}
.srad-label{padding:6px 14px;border:1px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
.srad:checked+.srad-label{border-color:var(--pink);background:var(--pink-bg);color:var(--pink);font-weight:700}
.toggle-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
.tog-input{display:none}
.tog-track{width:40px;height:22px;background:var(--border);border-radius:11px;position:relative;transition:.2s;flex-shrink:0}
.tog-track::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:white;top:2px;left:2px;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tog-input:checked~.tog-track{background:var(--pink)}
.tog-input:checked~.tog-track::after{transform:translateX(18px)}
.tog-lbl{font-size:13px;color:var(--ink3)}

/* Export & status */
.export-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--pink);color:white;font-size:15px;font-weight:700;padding:16px;border-radius:var(--radius);border:none;cursor:pointer;font-family:inherit;margin-bottom:20px;transition:.15s}
.export-btn:hover{background:#d43d79}.export-btn:disabled{background:var(--ink4);cursor:not-allowed}
.progress-area{display:none;text-align:center;padding:28px;background:white;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.prog-label{font-size:14px;font-weight:600;margin-bottom:14px}
.prog-wrap{background:var(--light-gray);border-radius:8px;height:8px;overflow:hidden;margin-bottom:10px}
.prog-bar{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--pink),#f5a8cc);width:0;transition:width .3s ease}
.prog-pct{font-size:12px;color:var(--ink3)}
.error-area{display:none;background:#fff5f5;border:1px solid #fca5a5;border-radius:var(--radius);padding:20px;margin-bottom:16px;text-align:center;color:#dc2626;font-size:13px}
.result-area{display:none;background:white;border:1px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center;margin-bottom:16px}
.result-icon{font-size:42px;color:#22c55e;margin-bottom:10px}
.result-txt{font-size:15px;font-weight:600;margin-bottom:20px}
.dl-btn{display:inline-flex;align-items:center;gap:8px;background:var(--pink);color:white;text-decoration:none;font-size:14px;font-weight:700;padding:12px 28px;border-radius:24px;transition:.15s}
.dl-btn:hover{background:#d43d79}
.again-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:13px;color:var(--ink3);cursor:pointer;font-family:inherit;transition:.15s;margin-left:10px}
.again-btn:hover{border-color:var(--pink);color:var(--pink)}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/">办公<span>工具箱</span></a>
  <ul class="nav-links">
    <li><a href="/#pdf">PDF处理</a></li>
    <li><a href="/#image">图片处理</a></li>
    <li><a href="/#translate">翻译</a></li>
  </ul>
</nav>
<main>
  <div class="breadcrumb">
    <a href="/">首页</a><i class="ti ti-chevron-right"></i>
    <a href="/#pdf">PDF处理</a><i class="ti ti-chevron-right"></i>
    <span>PDF 编辑器</span>
  </div>
  <div class="tool-header">
    <div class="tool-title-row">
      <div class="tool-icon-big"><i class="ti ti-layout-grid"></i></div>
      <h1>PDF 编辑器</h1>
    </div>
    <p class="tool-desc">上传 PDF 后可视化排列每一页，删除、拖拽调序、追加其他 PDF，再选择是否旋转、加水印、转黑白、压缩、加密，一键导出新 PDF。</p>
  </div>

  <!-- Upload state -->
  <div id="uploadState">
    <div class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept=".pdf" style="display:none">
      <i class="ti ti-files upload-icon"></i>
      <div class="upload-title">拖拽 PDF 到这里开始编辑</div>
      <div class="upload-sub">支持 PDF 文件，大小限制 100 MB</div>
      <div class="pwd-row" id="pwdRow" onclick="event.stopPropagation()">
        <label for="openPwd">有密码？</label>
        <input type="password" id="openPwd" placeholder="输入打开密码（可选）">
      </div>
    </div>
    <div class="loading-area" id="loadingArea" style="display:none">
      <div class="spinner"></div>
      <div style="font-size:13px;color:var(--ink3)">正在生成缩略图，请稍候…</div>
    </div>
  </div>

  <!-- Edit state -->
  <div id="editState" style="display:none">
    <div class="toolbar">
      <div class="page-count-badge" id="pageCountBadge">0 页</div>
      <button class="add-pdf-btn" id="addPdfBtn"><i class="ti ti-file-plus"></i>追加 PDF</button>
      <input type="file" id="addFileInput" accept=".pdf" style="display:none">
    </div>

    <div class="thumb-grid" id="thumbGrid">
      <div class="thumb-grid-empty">暂无页面</div>
    </div>

    <div class="options-panel">
      <div class="opt-section">
        <div class="opt-title">页面设置</div>
        <div class="opt-row">
          <span>统一页面大小</span>
          <div class="radios">
            <input class="srad" type="radio" name="usize" id="usizeKeep" value="" checked>
            <label class="srad-label" for="usizeKeep">保持原样</label>
            <input class="srad" type="radio" name="usize" id="usizeA4" value="a4">
            <label class="srad-label" for="usizeA4">A4</label>
            <input class="srad" type="radio" name="usize" id="usizeA3" value="a3">
            <label class="srad-label" for="usizeA3">A3</label>
          </div>
        </div>
        <div class="opt-row">
          <span>旋转所有页面</span>
          <div class="radios">
            <input class="srad" type="radio" name="rotate" id="rot0" value="0" checked>
            <label class="srad-label" for="rot0">不旋转</label>
            <input class="srad" type="radio" name="rotate" id="rot90" value="90">
            <label class="srad-label" for="rot90">顺时针 90°</label>
            <input class="srad" type="radio" name="rotate" id="rot180" value="180">
            <label class="srad-label" for="rot180">180°</label>
            <input class="srad" type="radio" name="rotate" id="rot270" value="270">
            <label class="srad-label" for="rot270">逆时针 90°</label>
          </div>
        </div>
      </div>
      <div class="opt-section">
        <div class="opt-title">内容处理</div>
        <div class="opt-row">
          <span>添加水印</span>
          <input class="text-input" type="text" id="watermarkText" placeholder="输入水印文字，留空则不加">
        </div>
        <div class="opt-row">
          <span>转为黑白</span>
          <label class="toggle-wrap">
            <input class="tog-input" type="checkbox" id="grayscaleTog">
            <span class="tog-track"></span>
            <span class="tog-lbl" id="togGray">关</span>
          </label>
        </div>
        <div class="opt-row">
          <span>压缩文件</span>
          <label class="toggle-wrap">
            <input class="tog-input" type="checkbox" id="compressTog">
            <span class="tog-track"></span>
            <span class="tog-lbl" id="togCmp">关</span>
          </label>
        </div>
      </div>
      <div class="opt-section">
        <div class="opt-title">安全</div>
        <div class="opt-row">
          <span>设置打开密码</span>
          <input class="text-input" type="password" id="encryptPwd" placeholder="留空则不加密">
        </div>
      </div>
    </div>

    <button class="export-btn" id="exportBtn"><i class="ti ti-file-export"></i>导出 PDF</button>

    <div class="progress-area" id="progressArea">
      <div class="prog-label">正在处理，请稍候…</div>
      <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
      <div class="prog-pct" id="progPct">0%</div>
    </div>
    <div class="error-area" id="errorArea"></div>
    <div class="result-area" id="resultArea">
      <div class="result-icon"><i class="ti ti-circle-check"></i></div>
      <div class="result-txt">PDF 导出成功！</div>
      <a class="dl-btn" id="downloadBtn" href="#"><i class="ti ti-download"></i>下载 PDF</a>
      <button class="again-btn" id="againBtn"><i class="ti ti-refresh"></i>重新开始</button>
    </div>
  </div>
</main>

<script src="/assets/analytics.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
const uploadState  = document.getElementById('uploadState');
const uploadArea   = document.getElementById('uploadArea');
const loadingArea  = document.getElementById('loadingArea');
const fileInput    = document.getElementById('fileInput');
const openPwd      = document.getElementById('openPwd');
const editState    = document.getElementById('editState');
const thumbGrid    = document.getElementById('thumbGrid');
const addPdfBtn    = document.getElementById('addPdfBtn');
const addFileInput = document.getElementById('addFileInput');
const exportBtn    = document.getElementById('exportBtn');
const progressArea = document.getElementById('progressArea');
const progBar      = document.getElementById('progBar');
const progPct      = document.getElementById('progPct');
const errorArea    = document.getElementById('errorArea');
const resultArea   = document.getElementById('resultArea');
const downloadBtn  = document.getElementById('downloadBtn');
const againBtn     = document.getElementById('againBtn');
const grayscaleTog = document.getElementById('grayscaleTog');
const compressTog  = document.getElementById('compressTog');

let sortable    = null;
let isFirstLoad = true;

function createCard(sessionFile, pageIdx, thumbSrc) {
  const card = document.createElement('div');
  card.className = 'thumb-card';
  card.dataset.session = sessionFile;
  card.dataset.idx     = String(pageIdx);

  const del = document.createElement('button');
  del.className = 'thumb-del';
  del.title     = '删除此页';
  del.innerHTML = '<i class="ti ti-x"></i>';
  del.addEventListener('click', (e) => {
    e.stopPropagation();
    card.remove();
    updatePageNumbers();
  });

  const img = document.createElement('img');
  img.className = 'thumb-img';
  img.src       = thumbSrc;
  img.loading   = 'lazy';
  img.draggable = false;

  const lbl = document.createElement('div');
  lbl.className = 'thumb-label';

  card.append(del, img, lbl);
  return card;
}

function updatePageNumbers() {
  const cards = thumbGrid.querySelectorAll('.thumb-card');
  cards.forEach((c, i) => {
    c.querySelector('.thumb-label').textContent = '第 ' + (i + 1) + ' 页';
  });
  document.getElementById('pageCountBadge').textContent = cards.length + ' 页';
  const emp = thumbGrid.querySelector('.thumb-grid-empty');
  if (emp) emp.remove();
}

function initSortable() {
  if (sortable) { sortable.destroy(); sortable = null; }
  sortable = new Sortable(thumbGrid, {
    animation: 150,
    ghostClass: 'thumb-ghost',
    onEnd: updatePageNumbers,
  });
}

async function uploadPdf(file, pwd) {
  const first = isFirstLoad;
  if (first) {
    uploadArea.style.display = 'none';
    loadingArea.style.display = 'block';
  } else {
    addPdfBtn.disabled  = true;
    addPdfBtn.innerHTML = '加载中…';
  }

  try {
    const fd = new FormData();
    fd.append('file', file);
    if (pwd) fd.append('password', pwd);
    const res  = await fetch('/api/pdf/thumbnails', { method: 'POST', body: fd });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || '加载失败');

    for (let i = 0; i < data.page_count; i++) {
      thumbGrid.appendChild(createCard(data.session_file, i, data.thumbnails[i]));
    }
    updatePageNumbers();

    if (first) {
      isFirstLoad = false;
      uploadState.style.display = 'none';
      editState.style.display   = 'block';
      initSortable();
    }
  } catch (err) {
    if (first) {
      loadingArea.style.display = 'none';
      uploadArea.style.display  = 'block';
    }
    alert(err.message || '上传失败，请重试');
  } finally {
    if (!first) {
      addPdfBtn.disabled    = false;
      addPdfBtn.innerHTML   = '<i class="ti ti-file-plus"></i>追加 PDF';
    }
  }
}

// Upload area events
uploadArea.addEventListener('click', (e) => {
  if (e.target === openPwd || e.target.closest('#pwdRow')) return;
  fileInput.click();
});
uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('drag'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag'));
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f) uploadPdf(f, openPwd.value || '');
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) uploadPdf(fileInput.files[0], openPwd.value || '');
  fileInput.value = '';
});

// Inject pink pick button
(function () {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.style.cssText = 'display:inline-flex;align-items:center;gap:8px;background:#e94c88;color:#fff;font-size:13px;font-weight:700;padding:10px 24px;border-radius:24px;border:none;cursor:pointer;font-family:inherit;margin-top:4px;';
  btn.innerHTML = '<i class="ti ti-folder-open"></i>选择 PDF 文件';
  btn.onmouseover = () => { btn.style.background = '#d43d79'; };
  btn.onmouseout  = () => { btn.style.background = '#e94c88'; };
  btn.onclick = (e) => { e.stopPropagation(); fileInput.click(); };
  const pwdRow = document.getElementById('pwdRow');
  uploadArea.insertBefore(btn, pwdRow);
})();

// Append more pages
addPdfBtn.addEventListener('click', () => addFileInput.click());
addFileInput.addEventListener('change', () => {
  if (addFileInput.files[0]) uploadPdf(addFileInput.files[0], '');
  addFileInput.value = '';
});

// Toggle labels
grayscaleTog.addEventListener('change', () => {
  document.getElementById('togGray').textContent = grayscaleTog.checked ? '开' : '关';
});
compressTog.addEventListener('change', () => {
  document.getElementById('togCmp').textContent = compressTog.checked ? '开' : '关';
});

// Export
exportBtn.addEventListener('click', doExport);

async function doExport() {
  const cards = [...thumbGrid.querySelectorAll('.thumb-card')];
  if (!cards.length) { alert('没有页面，请先上传 PDF'); return; }

  const pagesSpec = cards.map(c => ({
    file: c.dataset.session,
    idx:  parseInt(c.dataset.idx, 10),
  }));

  const uniformSize   = (document.querySelector('input[name="usize"]:checked') || {}).value || '';
  const rotateDeg     = (document.querySelector('input[name="rotate"]:checked') || {}).value || '0';
  const watermarkText = document.getElementById('watermarkText').value.trim();
  const grayscale     = grayscaleTog.checked;
  const compress      = compressTog.checked;
  const encryptPwd    = document.getElementById('encryptPwd').value;

  exportBtn.disabled        = true;
  progressArea.style.display = 'block';
  errorArea.style.display    = 'none';
  resultArea.style.display   = 'none';
  progBar.style.width        = '0%';
  progPct.textContent        = '0%';

  let pct = 0;
  const step  = grayscale ? 1 : 2;
  const timer = setInterval(() => {
    pct = Math.min(pct + step, 88);
    progBar.style.width = pct + '%';
    progPct.textContent = pct + '%';
  }, 200);

  try {
    const fd = new FormData();
    fd.append('pages', JSON.stringify(pagesSpec));
    if (uniformSize)   fd.append('uniform_size',   uniformSize);
    if (rotateDeg !== '0') fd.append('rotate_deg', rotateDeg);
    if (watermarkText) fd.append('watermark_text', watermarkText);
    fd.append('grayscale', grayscale ? 'true' : 'false');
    fd.append('compress',  compress  ? 'true' : 'false');
    if (encryptPwd)    fd.append('encrypt_password', encryptPwd);

    const res  = await fetch('/api/pdf/editor/export', { method: 'POST', body: fd });
    const data = await res.json();

    clearInterval(timer);
    progBar.style.width = '100%';
    progPct.textContent = '100%';

    if (!data.success) throw new Error(data.error || '导出失败');

    setTimeout(() => {
      progressArea.style.display = 'none';
      resultArea.style.display   = 'block';
      downloadBtn.href = '/api/download/' + data.filename;
      exportBtn.disabled = false;
    }, 400);
  } catch (err) {
    clearInterval(timer);
    progressArea.style.display = 'none';
    errorArea.style.display    = 'block';
    errorArea.textContent      = err.message || '导出失败，请重试';
    exportBtn.disabled = false;
  }
}

// Start over
againBtn.addEventListener('click', () => {
  thumbGrid.innerHTML = '<div class="thumb-grid-empty">暂无页面</div>';
  document.getElementById('watermarkText').value = '';
  document.getElementById('encryptPwd').value    = '';
  document.getElementById('usizeKeep').checked   = true;
  document.getElementById('rot0').checked        = true;
  grayscaleTog.checked = false;
  compressTog.checked  = false;
  document.getElementById('togGray').textContent = '关';
  document.getElementById('togCmp').textContent  = '关';
  resultArea.style.display   = 'none';
  errorArea.style.display    = 'none';
  progressArea.style.display = 'none';
  editState.style.display    = 'none';
  loadingArea.style.display  = 'none';
  uploadArea.style.display   = 'block';
  uploadState.style.display  = 'block';
  openPwd.value   = '';
  exportBtn.disabled = false;
  isFirstLoad = true;
  if (sortable) { sortable.destroy(); sortable = null; }
});
</script>
</body>
</html>
